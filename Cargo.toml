# SPDX-License-Identifier: MIT

[workspace]
resolver = "2"
members = [
    "crates/uefi",
    "crates/uefi_alloc",
    "crates/uefi_std",
]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Jeremy Soller <jackpot51@gmail.com>"]
repository = "https://gitlab.redox-os.org/redox-os/uefi"
rust-version = "1.91.1"

[workspace.dependencies]
redox_uefi = { path = "crates/uefi", version = "0.1.14" }
redox_uefi_alloc = { path = "crates/uefi_alloc", version = "0.1.14" }

[workspace.lints.rust]
[workspace.lints.clippy]
